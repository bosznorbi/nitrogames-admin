<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060a12">
<meta name="robots" content="noindex">
<title>Csapat QR-kódok</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<style>
  .qr-wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 60px; }

  .qr-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .qr-card {
    border: 3px solid var(--line);
    border-top: 8px solid var(--team, var(--cyan));
    background: var(--panel);
    box-shadow: var(--px) var(--px) 0 var(--shadow);
    padding: 14px;
    text-align: center;
  }

  /* A QR fehér alapon, nagy kontraszttal: képernyőről kell beolvasni. */
  .qr-card .sheet {
    background: #fff;
    border: 3px solid #000;
    padding: 10px;
  }

  .qr-card img { width: 100%; height: auto; display: block; }

  .qr-card small {
    display: block;
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--cyan);
    margin: 12px 0 4px;
  }

  .qr-card b {
    display: block;
    font-family: var(--font-display);
    font-size: 15px;
    text-transform: uppercase;
    line-height: 1.5;
    min-height: 3em;
  }

  .qr-card { cursor: zoom-in; }
  .qr-card:hover { border-color: var(--cyan); border-top-color: var(--team, var(--cyan)); }

  /* Teljes képernyős nagyítás: ha telefonról kell megmutatni valakinek. */
  #nagyito {
    position: fixed;
    inset: 0;
    z-index: 10001;
    background: rgba(3, 6, 12, 0.96);
    display: grid;
    place-items: center;
    padding: 4vmin;
    cursor: zoom-out;
  }

  #nagyito[hidden] { display: none; }

  #nagyito .doboz {
    background: #fff;
    border: 4px solid #000;
    padding: 3vmin;
    max-width: min(88vw, 88vh);
  }

  #nagyito img { width: 100%; height: auto; display: block; }

  #nagyito .felirat {
    margin-top: 3vmin;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: clamp(14px, 3vmin, 26px);
    color: var(--text);
  }

  #nagyito .sug { display: block; font-size: 14px; color: var(--muted); margin-top: 8px; }

  /* A kézzel begépelhető cím: ez a tartalék, ha a QR nem olvas be. */
  .beirhato {
    display: block;
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 13px;
    color: var(--text);
    background: rgba(46, 232, 255, 0.08);
    border: 2px solid var(--line);
    padding: 5px 4px;
    margin: 10px 0 0;
    word-break: break-all;
  }

  .beirhato.nagy {
    display: inline-block;
    margin: 2vmin 0 0;
    font-size: clamp(13px, 2.2vmin, 20px);
    padding: 8px 12px;
  }

  @media (max-width: 900px) { .qr-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .qr-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="qr-wrap">
  <div class="admin-top">
    <div class="row tight">
      <a class="back" href="/admin" aria-label="Vissza az adminba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="brand"><img src="/static/img/logo-mark-white.svg" alt="Nitrowise" width="26" height="24"><span>Csapat QR-kódok</span></span>
    </div>
    <div class="row tight">
      <button class="mini" id="frissit" hidden>Hálózati cím frissítése</button>
      <a class="mini ok" href="/api/admin/print/jatek-qr.pdf?nezet=inline" target="_blank" rel="noopener">Nyomtatási kép</a>
      <a class="mini" href="/api/admin/print/teams.pdf?nezet=inline" target="_blank" rel="noopener">Csapat kezdőcsomag (PDF)</a>
    </div>
  </div>

  <p class="lead" id="intro">
    Ezek a QR-kódok visznek a csapatok szavazólapjára. Olvasd be őket a
    telefonoddal erről a képernyőről, és úgy tudod végigpróbálni a szavazást,
    mintha körbejárnál a teremben.
  </p>

  <div class="qr-grid" id="grid"></div>
</div>

<div id="nagyito" hidden>
  <div>
    <div class="doboz"><img id="nagyKep" alt=""></div>
    <div class="felirat"><span id="nagyNev"></span><code id="nagyKod" class="beirhato nagy"></code><span class="sug">Koppints bárhová a bezáráshoz</span></div>
  </div>
</div>

<script type="module">
import { api, el, toast } from '/static/js/app.js';

const $ = (id) => document.getElementById(id);
let teams = [];
let host = location.host;

function render() {
  if (!teams.length) {
    $('grid').replaceChildren(el('div', { class: 'note' }, 'Még nincs aktív csapat.'));
    return;
  }

  $('grid').replaceChildren(
    ...teams.map((t) =>
      el('div', {
        class: 'qr-card',
        style: { '--team': t.accent_color || '#2ee8ff' },
        onclick: () => nagyit(t),
      },
        el('div', { class: 'sheet' },
          el('img', {
            alt: `${t.number}. csapat QR-kódja`,
            src: `/api/admin/qr?format=png&size=900&data=${encodeURIComponent(t.vote_url)}`,
          })
        ),
        el('small', {}, `${t.number}. csapat`),
        // Aki nem tudja beolvasni a QR-t, ezt gépeli be a böngészőbe.
        el('code', { class: 'beirhato' }, `${host}/${t.vote_code}`),
        // Ne írjuk ki kétszer ugyanazt, amíg a csapat nem adott nevet a játéknak.
        t.label === `${t.number}. csapat`
          ? el('b', { class: 'muted' }, 'még nincs neve')
          : el('b', {}, t.label)
      )
    )
  );
}

function nagyit(t) {
  $('nagyKep').src = `/api/admin/qr?format=png&size=1200&data=${encodeURIComponent(t.vote_url)}`;
  $('nagyKep').alt = `${t.number}. csapat QR-kódja`;
  $('nagyNev').textContent = t.label === `${t.number}. csapat` ? `${t.number}. csapat` : t.label;
  $('nagyKod').textContent = `${host}/${t.vote_code}`;
  $('nagyito').hidden = false;
}

$('nagyito').addEventListener('click', () => { $('nagyito').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('nagyito').hidden = true; });

async function betolt() {
  const r = await api('/api/admin/teams');
  teams = r.teams.filter((t) => t.active);
  $('intro').textContent = teams.length
    ? `${teams.length} csapat. Olvasd be őket a telefonoddal erről a képernyőről, és úgy tudod végigpróbálni a szavazást, mintha körbejárnál a teremben.`
    : 'Még nincs aktív csapat. Az admin Csapatok fülén hozz létre párat.';
  render();
}

$('frissit').addEventListener('click', async () => {
  const btn = $('frissit');
  btn.disabled = true;
  try {
    const r = await api('/api/admin/halozat/frissites', { method: 'POST' });
    toast(r.valtozott ? `Új cím: ${r.ip}` : 'A cím nem változott');
    await betolt();
  } catch (err) {
    toast(err.message, true);
  }
  btn.disabled = false;
});

api('/api/admin/overview')
  .then((o) => {
    // Élesben a cím rögzített, ott nincs mit frissíteni.
    $('frissit').hidden = o.base_url_fixed;
    try { host = new URL(o.base_url).host; } catch { /* marad a bongeszo cime */ }
    return betolt();
  })
  .catch((err) => {
    if (err.status === 401) location.href = '/admin/login';
    else toast(err.message, true);
  });
</script>
</body>
</html>
