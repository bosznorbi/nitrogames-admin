<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Szavazói QR-ív</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<div class="print-toolbar no-print">
  <a class="mini" href="/admin#szavazok">← Vissza az adminba</a>
  <button class="btn" id="print">Nyomtatás</button>
  <label class="switch"><input type="checkbox" id="onlyNew"><i></i><span>Csak a még be nem lépettek</span></label>
  <span class="muted small" id="count"></span>
</div>

<div class="sheet voters" id="sheet"></div>

<script type="module">
import { api, el, toast } from '/static/js/app.js';

let voters = [];

function render() {
  const list = document.getElementById('onlyNew').checked ? voters.filter((v) => !v.activated) : voters;
  document.getElementById('count').textContent = `${list.length} papír`;
  document.getElementById('sheet').replaceChildren(
    ...list.map((v) =>
      el('div', { class: 'ticket' },
        el('img', {
          alt: `QR: ${v.code}`,
          loading: 'lazy',
          src: `/api/admin/qr?format=png&size=320&data=${encodeURIComponent(v.login_url)}`,
        }),
        el('h3', {}, 'Szavazó belépő'),
        el('div', { class: 'code' }, v.code),
        el('p', {}, 'Olvasd be a telefonoddal. Elég egyszer, utána a böngésződ megjegyez.'),
        el('p', {}, 'Ha nem megy: nyisd meg a szavazóoldalt és írd be a fenti kódot.')
      )
    )
  );
}

document.getElementById('print').addEventListener('click', () => window.print());
document.getElementById('onlyNew').addEventListener('change', render);

api('/api/admin/voters')
  .then((r) => { voters = r.voters; render(); })
  .catch((err) => {
    if (err.status === 401) location.href = '/admin/login';
    else toast(err.message, true);
  });
</script>
</body>
</html>
