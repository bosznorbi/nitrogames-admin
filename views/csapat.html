<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="robots" content="noindex">
<title>Csapat konzol</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<style>
  .team-wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 60px; }

  pre.code {
    background: #05090f;
    border: 3px solid var(--line);
    padding: 13px 14px;
    overflow-x: auto;
    font-family: var(--font-display);
    font-size: 13px;
    line-height: 1.85;
    margin: 0 0 12px;
    white-space: pre;
    color: var(--green);
  }

  .todo { display: grid; gap: 8px; }

  .todo-item {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 11px;
    align-items: start;
    padding: 11px 13px;
    border: 3px solid var(--line);
    background: var(--panel-2);
  }

  .todo-item.ok { border-color: var(--green); background: rgba(61, 255, 158, 0.08); }

  .todo-mark {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-size: 14px;
    background: var(--line);
    color: var(--muted);
  }

  .todo-item.ok .todo-mark { background: var(--green); color: #04231a; }
  .todo-item strong { display: block; font-family: var(--font-display); font-size: 14px; text-transform: uppercase; line-height: 1.55; }
  .todo-item code { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); word-break: break-all; }

  /* Lenyitható végpontok példákkal. */
  .vegpont {
    border: 3px solid var(--line);
    background: var(--panel-2);
    margin-bottom: 8px;
  }

  .vegpont summary {
    cursor: pointer;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 68px 1fr;
    gap: 4px 10px;
    align-items: baseline;
    list-style: none;
  }

  .vegpont summary::-webkit-details-marker { display: none; }
  .vegpont summary::before { content: none; }
  .vegpont[open] { border-color: var(--line-lit); }
  .vegpont summary:hover { background: rgba(46, 232, 255, 0.05); }

  .vegpont summary b {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--green);
  }

  .vegpont summary code { font-size: 14px; color: var(--text); word-break: break-all; }

  .vegpont summary span {
    grid-column: 2;
    display: block;
    font-size: 14px;
    color: var(--muted);
  }

  .pelda { padding: 0 12px 12px; }

  .pelda small {
    display: block;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cyan);
    margin: 8px 0 5px;
  }

  /* minmax(0, 1fr): a sima 1fr legkisebb merete a tartalom min-content
     szelessege, es a fajlmezo belso szelessege igy szetfeszitette a racsot. */
  .preview { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: start; }

  .preview .phone {
    width: 120px;
    aspect-ratio: 9 / 16;
    border: 3px solid #000;
    background: #fff center / cover no-repeat;
    display: grid;
    place-items: center;
    color: #55627a;
    font-size: 12px;
    text-align: center;
    padding: 9px;
  }

  .tile-preview {
    width: 78px;
    aspect-ratio: 3 / 4;
    border: 3px solid var(--line-lit);
    background: var(--panel-2) center / cover no-repeat;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-family: var(--font-display);
    font-size: 12px;
    text-transform: uppercase;
  }

  @media (max-width: 600px) { .preview { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>

<div class="team-wrap">
  <div class="admin-top">
    <div class="row tight">
      <a class="back" href="/" aria-label="Vissza">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="brand"><img src="/static/img/logo-mark-white.svg" alt="Nitrowise" width="26" height="24"><span>Csapat konzol</span></span>
    </div>
    <button class="mini" id="forget" hidden>Kód elfelejtése</button>
  </div>

  <section id="login">
    <h1>Csapatkód</h1>
    <p class="lead">
      A papírotokon van egy nyolc karakteres kód. Írd be, és látod, mit kell még
      beállítani a játékotokhoz, illetve letöltheted a saját QR-kódotokat.
    </p>
    <div class="card">
      <label class="field">
        <span>Kód a papírról</span>
        <input type="text" id="code" class="code-input" style="font-size:24px;letter-spacing:0.18em;text-indent:0.18em"
               placeholder="ABCD-1234" maxlength="9" autocapitalize="characters" autocorrect="off" spellcheck="false">
      </label>
      <button class="btn block" id="connect">Csatlakozás</button>
      <div class="note err" id="loginErr" hidden style="margin-top:12px"></div>
    </div>
  </section>

  <section id="console" hidden></section>
</div>

<script type="module" src="/static/js/csapat.js"></script>
</body>
</html>
