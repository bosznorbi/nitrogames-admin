<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="robots" content="noindex">
<title>Nitrogames szavazás</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header class="topbar compact">
  <span class="brand"><img src="/static/img/logo-mark-white.svg" alt="Nitrowise" width="24" height="22"><span id="eventName">Nitrogames</span></span>
</header>

<main class="wrap tight-top">
  <div id="closed"></div>

  <div class="progress-ring">
    <b id="progressText">…</b>
    <span id="progressSub"></span>
  </div>
  <div class="bar" style="margin-bottom:12px"><i id="progressBar"></i></div>

  <ul class="tiles" id="tiles">
    <li class="tile"></li><li class="tile"></li><li class="tile"></li>
    <li class="tile"></li><li class="tile"></li><li class="tile"></li>
  </ul>

  <p class="small muted center" id="hint" style="margin:12px 0 0">
    Olvasd be a csapat asztalán lévő QR-kódot.
  </p>
</main>

<!-- Első belépéskor pár másodpercre megjelenik, aztán eltűnik. -->
<div id="welcome" hidden>
  <div class="welcome-box">
    <div class="welcome-mark"><i class="tick"></i></div>
    <strong>Sikeres belépés</strong>
    <span>A telefonod megjegyzett, mehet a szavazás.</span>
  </div>
</div>

<script type="module">
import { api, el, toast } from '/static/js/app.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

const justVoted = params.get('szavaztam');
const belepett = params.get('belepes') === '1';
if (justVoted || belepett) history.replaceState(null, '', '/');

function tileNode(t, celebrate) {
  const art = el('div', {
    class: `tile-art ${t.icon_url ? '' : 'noart'}`,
    style: t.icon_url ? { backgroundImage: `url("${t.icon_url}")` } : {},
  }, t.icon_url ? '' : String(t.number));

  const tartalom = [art, el('div', { class: 'tile-name' }, t.label)];
  const kozos = {
    class: `tile ${t.voted ? 'done' : ''} ${celebrate ? 'celebrate' : ''}`,
    style: { '--team': t.accent_color },
    dataset: { id: t.public_id },
  };

  // Amire már szavazott, azt innen is módosíthatja. A többihez QR-kód kell.
  return el('li', {},
    t.voted
      ? el('a', { ...kozos, href: `/t/${t.public_id}`, title: `${t.label}: pontszám módosítása` }, ...tartalom)
      : el('div', { ...kozos, title: t.label }, ...tartalom)
  );
}

function welcome() {
  const box = $('welcome');
  box.hidden = false;
  setTimeout(() => {
    box.classList.add('tunik');
    setTimeout(() => { box.hidden = true; }, 400);
  }, 2200);
}

async function load() {
  let data;
  try {
    data = await api('/api/home');
  } catch (err) {
    if (err.status === 401) {
      location.replace('/belepes?next=' + encodeURIComponent('/'));
      return;
    }
    throw err;
  }

  document.title = `${data.event_name} szavazás`;
  $('eventName').textContent = data.event_name;

  const remaining = data.total - data.done;
  $('progressText').textContent = `${data.done} / ${data.total}`;
  $('progressSub').textContent = !data.total
    ? 'még nincs csapat'
    : remaining === 0
      ? 'mind megvan'
      : `még ${remaining} játék`;
  $('progressBar').style.width = data.total ? `${Math.round((data.done / data.total) * 100)}%` : '0%';

  $('closed').replaceChildren(
    data.voting_open
      ? ''
      : el('div', { class: 'note warn', style: { marginBottom: '12px' } },
          'A szavazás még nem indult el. Ez az oldal a tiéd, nyugodtan bezárhatod.')
  );

  $('tiles').replaceChildren(...data.teams.map((t) => tileNode(t, t.public_id === justVoted)));
  $('hint').textContent = remaining === 0 && data.total
    ? 'Minden játékot pontoztál. Köszönjük!'
    : 'Olvasd be a csapat asztalán lévő QR-kódot.';

  if (justVoted) {
    const node = document.querySelector(`.tile[data-id="${CSS.escape(justVoted)}"]`);
    if (node) node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

if (belepett) welcome();
load().catch((err) => toast(err.message, true));
</script>
</body>
</html>
