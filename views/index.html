<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="robots" content="noindex">
<title>Nitrogames szavazás</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header class="topbar">
  <span class="brand"><img src="/static/img/logo-mark-white.svg" alt="Nitrowise" width="26" height="24"><span id="eventName">Nitrogames</span></span>
</header>

<main class="wrap">
  <div id="banner"></div>

  <div class="progress-ring">
    <b id="progressText">…</b>
    <span id="progressSub"></span>
  </div>
  <div class="bar" style="margin-bottom:18px"><i id="progressBar"></i></div>

  <ul class="tiles" id="tiles">
    <li class="tile"></li><li class="tile"></li><li class="tile"></li>
    <li class="tile"></li><li class="tile"></li><li class="tile"></li>
  </ul>

  <div class="spacer"></div>
  <p class="small muted center" id="hint">
    Egy játék pontozásához olvasd be a csapat asztalán lévő QR-kódot.
  </p>
</main>

<script type="module">
import { api, el, toast } from '/static/js/app.js';

const $ = (id) => document.getElementById(id);

/** A frissen leadott szavazat csempéje, az URL-ből. */
const params = new URLSearchParams(location.search);
const justVoted = params.get('szavaztam');
if (justVoted) history.replaceState(null, '', '/');

function tileNode(t, celebrate) {
  const art = el('div', {
    class: `tile-art ${t.icon_url ? '' : 'noart'}`,
    style: t.icon_url ? { backgroundImage: `url("${t.icon_url}")` } : {},
  }, t.icon_url ? '' : String(t.number));

  return el('li', {
    class: `tile ${t.voted ? 'done' : ''} ${celebrate ? 'celebrate' : ''}`,
    style: { '--team': t.accent_color },
    dataset: { id: t.public_id },
    title: t.label,
  },
    art,
    el('div', { class: 'tile-name' }, t.label)
  );
}

async function load() {
  let data;
  try {
    data = await api('/api/home');
  } catch (err) {
    if (err.status === 401) {
      location.replace('/belepes?next=' + encodeURIComponent('/'));
      return;
    }
    throw err;
  }

  document.title = `${data.event_name} szavazás`;
  $('eventName').textContent = data.event_name;

  const remaining = data.total - data.done;
  $('progressText').textContent = data.total === 0
    ? 'Még nincs csapat'
    : `${data.done} / ${data.total}`;
  $('progressSub').textContent = data.total === 0
    ? ''
    : remaining === 0
      ? 'mindegyikre szavaztál'
      : `még ${remaining} játék van hátra`;
  $('progressBar').style.width = data.total ? `${Math.round((data.done / data.total) * 100)}%` : '0%';

  $('banner').replaceChildren(
    data.voting_open
      ? el('div', { class: 'ready-banner' },
          el('div', { class: 'mark' }, el('i', { class: 'tick' })),
          el('div', {},
            el('strong', {}, data.ready_text || 'Minden készen áll!'),
            el('span', {}, 'Járd végig a játékokat, és olvasd be a QR-kódjukat.')
          )
        )
      : el('div', { class: 'note warn', style: { marginBottom: '18px' } },
          'A szavazás még nem indult el. Ez az oldal a tiéd, nyugodtan bezárhatod, a telefonod megjegyzett.')
  );

  $('tiles').replaceChildren(...data.teams.map((t) => tileNode(t, t.public_id === justVoted)));
  $('hint').textContent = remaining === 0 && data.total > 0
    ? 'Minden játékot pontoztál. Köszönjük!'
    : 'Egy játék pontozásához olvasd be a csapat asztalán lévő QR-kódot.';

  if (justVoted) {
    const node = document.querySelector(`.tile[data-id="${CSS.escape(justVoted)}"]`);
    if (node) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

load().catch((err) => toast(err.message, true));
</script>
</body>
</html>
