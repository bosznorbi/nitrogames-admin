<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="robots" content="noindex">
<title>Admin belépés</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<main class="wrap" style="padding-top:70px">
  <h1>Admin belépés</h1>
  <p class="lead">A szavazás vezérléséhez és az eredményekhez jelszó kell.</p>

  <div class="card">
    <form id="form" autocomplete="off">
      <label class="field">
        <span>Jelszó</span>
        <input type="password" id="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="btn block" type="submit" id="btn">Belépés</button>
    </form>
  </div>

  <div class="spacer"></div>
  <p class="center"><a class="btn quiet" href="/">Vissza a szavazáshoz</a></p>
</main>

<script type="module">
import { api, toast } from '/static/js/app.js';

const params = new URLSearchParams(location.search);
const next = params.get('next');
const target = next && next.startsWith('/admin') ? next : '/admin';

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try {
    await api('/api/admin/login', { method: 'POST', body: { password: document.getElementById('password').value } });
    location.replace(target);
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
    document.getElementById('password').select();
  }
});
</script>
</body>
</html>
