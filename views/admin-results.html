<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060a12">
<meta name="robots" content="noindex">
<title>Eredményhirdetés</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* Diavetítésnek készült: 16:9-en, teljes képernyőn, görgetés nélkül. */
  html, body { height: 100%; overflow: hidden; }

  .szinpad {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 1.4vh;
    padding: 2vh 2.4vw;
  }

  .fejlec { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .fejlec .cim { display: flex; align-items: center; gap: 1.2vw; }
  .fejlec img { height: 4.4vh; width: auto; display: block; }

  .fejlec h1 {
    margin: 0;
    font-size: clamp(16px, 3vh, 34px);
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .fejlec .sub { font-size: clamp(10px, 1.6vh, 15px); color: var(--muted); }

  /* ---------- dobogó ---------- */

  .dobogo {
    display: grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    align-items: end;
    gap: 1.6vw;
    min-height: 0;
  }

  .oszlop { display: flex; flex-direction: column; justify-content: flex-end; gap: 1vh; min-height: 0; }

  .hely-cimke {
    text-align: center;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.1em;
    font-size: clamp(10px, 1.7vh, 16px);
    color: var(--muted);
  }

  .talp {
    border: 3px solid var(--line-lit);
    border-bottom: none;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(22px, 6vh, 64px);
    color: var(--muted);
  }

  .oszlop.h1 .talp { height: 24vh; border-color: var(--amber); color: var(--amber); }
  .oszlop.h2 .talp { height: 16vh; }
  .oszlop.h3 .talp { height: 11vh; }

  /* ---------- csapatkártya ---------- */

  .csapat {
    border: 3px solid var(--line);
    background: var(--panel);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 1.1vh 1vw;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 1vw;
    cursor: pointer;
    border-left: 8px solid var(--team, var(--line-lit));
  }

  .csapat:hover { border-color: var(--cyan); border-left-color: var(--team, var(--cyan)); }

  .csapat .nev {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(11px, 2.1vh, 22px);
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Takart állapot: fix hosszú blokk, hogy a névhossz se áruljon el semmit. */
  .csapat.rejtve { cursor: pointer; }
  .csapat.rejtve .nev { color: #35507a; letter-spacing: 0.05em; }
  .csapat.rejtve .alcim { visibility: hidden; }

  .csapat .alcim { font-size: clamp(9px, 1.4vh, 13px); color: var(--muted); }

  .csapat .pont {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(13px, 2.4vh, 26px);
    color: var(--amber);
    text-align: right;
    white-space: nowrap;
  }

  .csapat.felfedve {
    border-color: var(--team, var(--cyan));
    background: color-mix(in srgb, var(--team, var(--cyan)) 12%, var(--panel));
    animation: felfed 0.5s steps(5);
  }

  @keyframes felfed {
    0% { transform: scale(0.9); filter: brightness(2.4); }
    100% { transform: scale(1); filter: none; }
  }

  .oszlop.h1 .csapat .nev { font-size: clamp(13px, 2.7vh, 30px); }
  .oszlop.h1 .csapat .pont { font-size: clamp(15px, 3vh, 32px); }

  .megosztott {
    text-align: center;
    font-size: clamp(9px, 1.4vh, 13px);
    color: var(--amber);
    font-family: var(--font-display);
    font-weight: 700;
  }

  /* ---------- a mezőny ---------- */

  .mezony {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.9vh 1.2vw;
    align-content: start;
    min-height: 0;
    overflow: hidden;
  }

  .mezony .csapat { padding: 0.8vh 0.9vw; box-shadow: 3px 3px 0 var(--shadow); }
  .mezony .csapat .nev { font-size: clamp(10px, 1.7vh, 17px); }
  .mezony .csapat .pont { font-size: clamp(11px, 1.8vh, 18px); }

  .sorszam {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--muted);
    font-size: clamp(10px, 1.6vh, 16px);
    margin-right: 0.6vw;
  }

  /* ---------- kategóriák ---------- */

  #kategoriak {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(3, 6, 12, 0.95);
    display: grid;
    place-items: center;
    padding: 4vh 4vw;
  }

  #kategoriak[hidden] { display: none; }

  .kat-racs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.4vh 1.4vw;
    max-width: 1100px;
    width: 100%;
  }

  .kat {
    border: 3px solid var(--line);
    background: var(--panel);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 1.4vh 1vw;
  }

  .kat small {
    display: block;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(9px, 1.4vh, 13px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 0.6vh;
  }

  .kat b { font-family: var(--font-display); font-weight: 700; font-size: clamp(12px, 2vh, 20px); }
  .kat span { display: block; font-size: clamp(9px, 1.4vh, 13px); color: var(--muted); margin-top: 0.3vh; }
</style>
</head>
<body>

<div class="szinpad">
  <div class="fejlec">
    <div class="cim">
      <img src="/static/img/logo-mark-white.svg" alt="Nitrowise">
      <div>
        <h1>Eredményhirdetés</h1>
        <div class="sub" id="sub">Töltés…</div>
      </div>
    </div>
    <div class="row tight">
      <button class="mini" id="mindet">Mindet felfedi</button>
      <button class="mini" id="ujra">Újra elrejt</button>
      <button class="mini" id="katGomb">Kategóriák</button>
    </div>
  </div>

  <div class="dobogo" id="dobogo"></div>
  <div class="mezony" id="mezony"></div>
</div>

<div id="kategoriak" hidden>
  <div>
    <h1 style="text-align:center;margin:0 0 2vh;font-size:clamp(16px,3vh,30px)">Kategóriagyőztesek</h1>
    <div class="kat-racs" id="katRacs"></div>
    <p class="center small muted" style="margin-top:2vh">Koppints bárhová a bezáráshoz</p>
  </div>
</div>

<script type="module">
import { api, el, toast } from '/static/js/app.js';

const $ = (id) => document.getElementById(id);
const TAKART = '████████';
const felfedve = new Set();
let adat = null;

function csapatKartya(t, extra = '') {
  const nyitva = felfedve.has(t.team_id);
  const kartya = el('div', {
    class: `csapat ${nyitva ? 'felfedve' : 'rejtve'} ${extra}`,
    style: { '--team': nyitva ? t.accent_color : 'transparent' },
    onclick: () => {
      felfedve.has(t.team_id) ? felfedve.delete(t.team_id) : felfedve.add(t.team_id);
      rajzol();
    },
  },
    el('div', {},
      el('div', { class: 'nev' }, nyitva ? t.label : TAKART),
      el('div', { class: 'alcim' }, `${t.number}. csapat · ${t.voters} szavazó`)
    ),
    el('div', { class: 'pont' }, t.total_pct === null ? '-' : String(t.total_pct))
  );
  return kartya;
}

function oszlop(hely, cimke, csapatok) {
  return el('div', { class: `oszlop h${hely}` },
    ...csapatok.map((t) => csapatKartya(t)),
    csapatok.length > 1
      ? el('div', { class: 'megosztott' }, `${csapatok.length} csapat holtversenyben`)
      : null,
    el('div', { class: 'hely-cimke' }, cimke),
    el('div', { class: 'talp' }, String(hely))
  );
}

function rajzol() {
  const helyek = new Map();
  for (const t of adat.ranking) {
    if (t.rank === null) continue;
    if (!helyek.has(t.rank)) helyek.set(t.rank, []);
    helyek.get(t.rank).push(t);
  }

  $('dobogo').replaceChildren(
    oszlop(2, 'Második hely', helyek.get(2) || []),
    oszlop(1, 'Első hely', helyek.get(1) || []),
    oszlop(3, 'Harmadik hely', helyek.get(3) || [])
  );

  const tobbi = [];
  for (const [hely, lista] of [...helyek].sort((a, b) => a[0] - b[0])) {
    if (hely <= 3) continue;
    for (const t of lista) tobbi.push([hely, t]);
  }
  for (const t of adat.ranking.filter((x) => x.rank === null)) tobbi.push([null, t]);

  $('mezony').replaceChildren(
    ...tobbi.map(([hely, t]) => {
      const k = csapatKartya(t);
      k.prepend(el('span', { class: 'sorszam' }, hely ? `${hely}.` : '-'));
      k.style.gridTemplateColumns = 'auto 1fr auto';
      return k;
    })
  );
}

async function betolt() {
  adat = await api('/api/admin/results');
  const s = adat.stats;
  $('sub').textContent =
    `${s.voters_voted} / ${s.voters_total} szavazó · ${s.submissions} szavazólap · `
    + (s.voting_open ? 'a szavazás még nyitva' : 'a szavazás lezárva');
  rajzol();
}

$('mindet').addEventListener('click', () => {
  adat.ranking.forEach((t) => felfedve.add(t.team_id));
  rajzol();
});

$('ujra').addEventListener('click', () => {
  felfedve.clear();
  rajzol();
});

$('katGomb').addEventListener('click', () => {
  $('katRacs').replaceChildren(
    ...adat.category_winners.map((w) =>
      el('div', { class: 'kat' },
        el('small', {}, w.label),
        w.winner
          ? el('div', {},
              el('b', {}, w.winner.label),
              el('span', {}, `${w.winner.number}. csapat · átlag ${w.winner.avg}`))
          : el('span', {}, 'Még nincs szavazat')
      )
    )
  );
  $('kategoriak').hidden = false;
});

$('kategoriak').addEventListener('click', () => { $('kategoriak').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('kategoriak').hidden = true; });

betolt().catch((err) => {
  if (err.status === 401) location.href = '/admin/login';
  else toast(err.message, true);
});

// A szavazás közben is nézhető, ezért időnként frissítjük a még nem felfedett adatokat.
setInterval(() => betolt().catch(() => {}), 15000);
</script>
</body>
</html>
